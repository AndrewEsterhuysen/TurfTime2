<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Soccer Team Rotation Manager</title>
    <link rel="stylesheet" href="css/styles-classic.css" id="theme-stylesheet">
</head>

<body>
    <div class="container">
        <h1>
            <span id="scoreUs" class="header-score header-score-left" style="display: none;">Us - <span id="scoreUsValue">0</span></span>
            ⚽ Turf Time 🥅
            <span id="scoreThem" class="header-score header-score-right" style="display: none;"><span id="scoreThemValue">0</span> - Them</span>
        </h1>
        <div class="top-controls">
            <div class="control-col">
                <div class="timer-wrapper">
                    <span class="timer-label">Match Time</span>
                    <span id="matchTimer" class="match-timer">00:00:00</span>
                </div>
            </div>
            <div class="control-col">
                <span id="teamNameDisplay" class="team-name-display"></span>
            </div>
            <div class="control-col">
                <div class="timer-wrapper">
                    <span class="timer-label">Rotate Time</span>
                    <span id="countdownTimer" class="countdown-timer">2:00</span>
                </div>
            </div>
        </div>

        <!-- Content area (scrollable) -->
        <div class="content-area">
            <div class="panel">
                <table class="roster-table" aria-label="Team Roster">
                    <thead>
                        <tr>
                            <th>Player</th>
                            <th>Field</th>
                            <th>Bench</th>
                            <th>Goalie</th>
                            <th>Inactive</th>
                        </tr>
                    </thead>
                    <tbody id="rosterBody"></tbody>
                </table>
                <!-- Inactive toggle for table view -->
                <div id="tableInactiveToggle" class="table-inactive-toggle-section" style="display: none;">
                    <button id="tableInactiveToggleBtn" class="inactive-toggle-btn">
                        <span id="tableInactiveCount" class="inactive-count">0 Inactive Players</span>
                        <span id="tableInactiveIcon" class="inactive-toggle-icon">▼</span>
                    </button>
                </div>
            </div>

            <!-- Swipeable Player List for View_A -->
            <div id="swipeableRoster" class="swipeable-roster" style="display: none;">
                <div id="swipeablePlayerList" class="swipeable-player-list"></div>
            </div>

            <!-- Rotation Display for VIEW_C with Score Buttons -->
            <div id="rotationDisplay" class="rotation-display" style="display: none;">
                <div class="rotation-content-wrapper">
                    <button id="teamAScoreBtn" class="score-button score-button-left">
                        <div class="score-label">Us</div>
                        <div class="score-value" id="teamAScore">0</div>
                    </button>
                    <div class="rotation-center">
                        <div class="rotation-title">Next Rotation</div>
                        <div id="rotationPairs" class="rotation-pairs"></div>
                    </div>
                    <button id="teamBScoreBtn" class="score-button score-button-right">
                        <div class="score-label">Them</div>
                        <div class="score-value" id="teamBScore">0</div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Fixed controls at bottom -->
        <div class="bottom-controls">
            <div class="control-col">
                <button id="startBtn">Start</button>
            </div>
            <div class="control-col">
                <button id="rotateBtn">Rotate</button>
            </div>
            <div class="control-col">
                <button id="viewlessBtn">View_A</button>
            </div>
        </div>
    </div>

    <!-- Custom Modal Dialog -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-dialog">
            <div id="modalTitle" class="modal-title"></div>
            <input type="text" id="modalInput" class="modal-input" />
            <div id="modalError" class="modal-error"></div>
            <div class="modal-buttons">
                <button id="modalAuto" class="modal-btn modal-btn-secondary" style="display: none;">Auto</button>
                <button id="modalCancel" class="modal-btn modal-btn-secondary">Cancel</button>
                <button id="modalOk" class="modal-btn modal-btn-primary">OK</button>
            </div>
        </div>
    </div>

    <!-- Rotation Count Modal -->
    <div id="rotationModalOverlay" class="modal-overlay">
        <div class="modal-dialog rotation-modal">
            <div class="modal-title">Rotation Count</div>
            <div class="rotation-counter">
                <button id="rotationIncrement" class="rotation-arrow">▲</button>
                <div id="rotationCountDisplay" class="rotation-count-display">1</div>
                <button id="rotationDecrement" class="rotation-arrow">▼</button>
            </div>
            <div class="modal-buttons">
                <button id="rotationModalClose" class="modal-btn modal-btn-primary">Close</button>
            </div>
        </div>
    </div>

    <script src="js/game-logger.js"></script>
    <script src="js/roster-manager.js"></script>

    <!-- Firebase SDK v10 (Modular) - Bundled locally to avoid SSL issues on Android -->
    <script type="module">
        // Import Firebase SDK modules from local bundle (no CDN required)
        import { initializeApp } from './js/firebase/firebase-app.js';
        import { getFirestore, enableIndexedDbPersistence, doc, setDoc, getDoc } from './js/firebase/firebase-firestore.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from './js/firebase/firebase-auth.js';
        import { getStorage } from './js/firebase/firebase-storage.js';
        import { getAnalytics } from './js/firebase/firebase-analytics.js';

        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDAKivCFX5kYYZ6SkAQluBNdR92I320glk",
            authDomain: "turf-timer.firebaseapp.com",
            projectId: "turf-timer",
            storageBucket: "turf-timer.firebasestorage.app",
            messagingSenderId: "846410659178",
            appId: "1:846410659178:web:f26efa105cf06cd241a113",
            measurementId: "G-Q6H3LXGZ8B"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
        const analytics = getAnalytics(app);

        // Enable offline persistence for Firestore (reduces cloud reads by 50-70%)
        enableIndexedDbPersistence(db)
            .then(() => {
                console.log('[Firebase] Offline persistence enabled');
            })
            .catch((err) => {
                if (err.code === 'failed-precondition') {
                    console.warn('[Firebase] Multiple tabs open, persistence only in first tab');
                } else if (err.code === 'unimplemented') {
                    console.warn('[Firebase] Browser does not support persistence');
                }
            });

        // Monitor authentication state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log('[Firebase] User signed in:', user.uid);
                window.firebaseUser = user;
            } else {
                console.log('[Firebase] No user signed in');
                window.firebaseUser = null;
            }
        });

        // Make Firebase services and functions available globally for roster-manager.js
        window.firebaseApp = app;
        window.firebaseDb = { db, doc, setDoc, getDoc };
        window.firebaseAuth = { auth, signInAnonymously, onAuthStateChanged };
        window.firebaseStorage = storage;
        window.firebaseAnalytics = analytics;

        console.log('[Firebase] SDK loaded successfully from CDN');
        console.log('[Firebase] Project:', firebaseConfig.projectId);

        // Initialize team service after Firebase is ready
        if (window.teamService) {
            window.teamService.initialize(db, auth);
            console.log('[Firebase] Team service initialized');
        }
    </script>

    <!-- Team Service -->
    <script src="js/team-service.js"></script>
</body>

</html>
