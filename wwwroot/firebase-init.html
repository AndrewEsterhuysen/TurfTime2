<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Init</title>
</head>
<body>
    <div id="status" style="display: none;">Initializing...</div>

    <!-- Mark as not ready initially -->
    <script>
        window.firebaseInitializing = true;
        window.firebaseReady = false;
        window.teamServiceReady = false;
        console.log('[Firebase Init] Starting initialization sequence...');
    </script>

    <!-- Firebase Core Initialization -->
    <script type="module">
        import { initializeApp } from './js/firebase/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from './js/firebase/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, getDoc, query, where, getDocs } from './js/firebase/firebase-firestore.js';

        console.log('[Firebase Init] Importing Firebase modules...');

        const firebaseConfig = {
            apiKey: 'AIzaSyD4kN7Ro2qT8GvHC_3eOJLZn5Fq-XbmF0Q',
            authDomain: 'turftimer-afdf6.firebaseapp.com',
            projectId: 'turftimer-afdf6',
            storageBucket: 'turftimer-afdf6.firebasestorage.app',
            messagingSenderId: '1034831516712',
            appId: '1:1034831516712:web:0aa4d3e40283e91d19d925',
            measurementId: 'G-DD6LZPWJQY'
        };

        console.log('[Firebase Init] Initializing Firebase app...');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Expose to window for global access
        window.firebaseApp = app;
        window.firebaseAuth = { auth, signInAnonymously, onAuthStateChanged };
        window.firebaseDb = { db, collection, doc, setDoc, getDoc, query, where, getDocs };

        console.log('[Firebase Init] Firebase modules loaded');

        // Sign in anonymously
        console.log('[Firebase Init] Starting anonymous authentication...');
        signInAnonymously(auth)
            .then((userCredential) => {
                console.log('[Firebase Init] ✅ Authenticated:', userCredential.user.uid);
                window.firebaseReady = true;

                // Now setup team service
                setupTeamService();
            })
            .catch((error) => {
                console.error('[Firebase Init] ❌ Auth error:', error);
                window.firebaseReady = false;
                window.firebaseInitializing = false;
            });

        function setupTeamService() {
            console.log('[Firebase Init] Setting up team service...');

            // Team Service (minimal, inline version)
            window.teamService = {
                async createTeam(teamId, teamName, inviteCode) {
                    try {
                        console.log('[TeamService] Creating team:', teamId);

                        if (!window.firebaseDb) {
                            return { success: false, error: 'Firebase not initialized' };
                        }

                        const { db, doc, setDoc } = window.firebaseDb;
                        const { auth } = window.firebaseAuth;
                        const userId = auth.currentUser?.uid;

                        if (!userId) {
                            return { success: false, error: 'User not authenticated' };
                        }

                        const teamRef = doc(db, 'teams', teamId);
                        await setDoc(teamRef, {
                            teamId: teamId,
                            teamName: teamName,
                            inviteCode: inviteCode,
                            createdAt: new Date().toISOString(),
                            createdBy: userId,
                            members: [userId]
                        });

                        console.log('[TeamService] ✅ Team created successfully');
                        return { success: true };
                    } catch (error) {
                        console.error('[TeamService] ❌ Create team error:', error);
                        return { success: false, error: error.message };
                    }
                },

                async joinTeam(inviteCode) {
                    try {
                        console.log('[TeamService] Joining team with code:', inviteCode);

                        if (!window.firebaseDb) {
                            return { success: false, error: 'Firebase not initialized' };
                        }

                        const { db, collection, query, where, getDocs } = window.firebaseDb;
                        const { auth } = window.firebaseAuth;
                        const userId = auth.currentUser?.uid;

                        if (!userId) {
                            return { success: false, error: 'User not authenticated' };
                        }

                        // Find team by invite code
                        const teamsRef = collection(db, 'teams');
                        const q = query(teamsRef, where('inviteCode', '==', inviteCode));
                        const querySnapshot = await getDocs(q);

                        if (querySnapshot.empty) {
                            return { success: false, error: 'Team not found' };
                        }

                        const teamDoc = querySnapshot.docs[0];
                        const teamData = teamDoc.data();

                        // Check if already a member
                        if (teamData.members && teamData.members.includes(userId)) {
                            return { 
                                success: true, 
                                alreadyMember: true,
                                teamId: teamData.teamId,
                                teamName: teamData.teamName
                            };
                        }

                        // Add user to members
                        const { doc: docRef, setDoc } = window.firebaseDb;
                        const teamRef = docRef(db, 'teams', teamData.teamId);
                        await setDoc(teamRef, {
                            ...teamData,
                            members: [...(teamData.members || []), userId]
                        }, { merge: true });

                        console.log('[TeamService] ✅ Joined team successfully');
                        return { 
                            success: true,
                            teamId: teamData.teamId,
                            teamName: teamData.teamName
                        };
                    } catch (error) {
                        console.error('[TeamService] ❌ Join team error:', error);
                        return { success: false, error: error.message };
                    }
                }
            };

            console.log('[Firebase Init] ✅ Team service ready');
            window.teamServiceReady = true;
            window.firebaseInitializing = false;

            // Update status
            const statusEl = document.getElementById('status');
            if (statusEl) {
                statusEl.textContent = 'Ready';
            }
        }
    </script>
</body>
</html>
